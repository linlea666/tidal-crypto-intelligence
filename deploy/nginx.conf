user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  gzip on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css;
  keepalive_timeout 65;
  client_max_body_size 16k;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  limit_req_zone $binary_remote_addr zone=login:1m rate=6r/m;
  server {
    listen 80;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://$host:8443$request_uri; }
  }
  server {
    listen 8443 ssl;
    ssl_certificate /etc/letsencrypt/live/tidal-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tidal-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:1m;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    set $backend http://app:8080;
    location = /api/v1/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass $backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 90s;
      proxy_buffering off;
    }
  }
}
